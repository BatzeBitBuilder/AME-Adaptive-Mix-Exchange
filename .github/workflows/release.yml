# SPDX-License-Identifier: AGPL-3.0-only
#
# Baut das VST3-Plugin unter Windows, führt den Smoke-Test aus und
# veröffentlicht ein GitHub-Release "v<CMake-Version>" mit ZIP-Anhang:
#  - bei einem Tag "v*" (Tag muss zur CMake-Version passen) oder
#  - manuell (Actions → Release → Run workflow, "release" anhaken).

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Release v<CMake-Version> erstellen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version ermitteln
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\(AME VERSION ([0-9.]+)'
          $ver = $line.Matches[0].Groups[1].Value
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $ver) { Write-Error "Tag $tag passt nicht zur CMake-Version $ver"; exit 1 }
          }
          "AME_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AME_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Neuestes Visual Studio des Runners, statische MSVC-Laufzeit (keine Redistributable nötig)
      - name: Konfigurieren
        run: cmake -B build -A x64 -DMTM_BUILD_TESTS=ON "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>"

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Smoke-Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $exe = Get-ChildItem -Recurse build -Filter AMESmokeTest.exe | Select-Object -First 1
          & $exe.FullName (Resolve-Path smoke)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paket schnüren
        shell: pwsh
        run: |
          $name = "AME-Adaptive-Mix-Exchange-$env:AME_VERSION-win64-vst3"
          $dst = "dist/$name"
          New-Item -ItemType Directory -Force -Path "$dst/Manual" | Out-Null
          Copy-Item -Recurse "build/AME_artefacts/Release/VST3/AME Adaptive Mix Exchange.vst3" $dst
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md $dst
          Copy-Item docs/manual/handbuch_de.md, docs/manual/manual_en.md "$dst/Manual"
          Compress-Archive -Path $dst -DestinationPath "dist/$name.zip"
          "AME_ZIP=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ame-win64-vst3
          path: ${{ env.AME_ZIP }}

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = ".github/release-notes/$env:AME_TAG.md"
          $ghArgs = @("$env:AME_TAG", "$env:AME_ZIP", "--title", "AME $env:AME_TAG", "--target", "${{ github.sha }}")
          if (Test-Path $notes) { $ghArgs += @("--notes-file", $notes) } else { $ghArgs += "--generate-notes" }
          gh release create @ghArgs
